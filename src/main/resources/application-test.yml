spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgre_db?currentSchema=gallerist}
    username: ${DB_USERNAME:yunus}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_DEFAULT_SCHEMA:gallerist}
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: test-secret-key-minimum-256-bit-uzunlugunda-olmali-test-icin-kullanilir-12345678
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins:
      - http://localhost:3000

  security:
    fail-on-redis-blacklist-error: false

  storage:
    endpoint: https://test.r2.cloudflarestorage.com
    bucket-name: randevu-test
    access-key: test-key
    secret-key: JWT_SECRET
    public-url: https://test-cdn.example.com

  sms:
    netgsm:
      api-url: https://api.netgsm.com.tr/sms/send/get
      username: test
      password: test
      header: TEST

  otp:
    ttl-seconds: 180
    max-attempts: 5
