spring:
  application:
    name: randevu
  profiles:
    active: dev

firebase:
  credentials-path: classpath:firebase/firebase-service-account.json
  enabled: true

# iyzico ödeme entegrasyonu
iyzico:
  api-key: ${IYZICO_API_KEY:change-me-iyzico-api-key}
  secret-key: ${IYZICO_SECRET_KEY:change-me-iyzico-secret-key}
  base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
  callback-url: ${IYZICO_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  deposit-rate: ${IYZICO_DEPOSIT_RATE:0.20}

app:
  notification:
    reminder-hours-before: 24
    review-request-hours-after: 1
  frontend-url: http://localhost:3000
